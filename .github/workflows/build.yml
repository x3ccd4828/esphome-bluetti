name: ESPHome compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/esphome/esphome:2026.9.1
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: apt-get update -qq && apt-get install -y -qq cmake g++ libmbedtls-dev libbearssl-dev
      - name: Test encryption and BLE command handling with sanitizers
        run: |
          cmake -S tests -B /tmp/bluetti-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/bluetti-tests --parallel 2
          ctest --test-dir /tmp/bluetti-tests --output-on-failure

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.9.1", latest, dev]
        config: [bluetti-el30v2.yaml, bluetti-el30v2-picow.yaml]
    continue-on-error: ${{ matrix.esphome == 'dev' }}
    container:
      image: ghcr.io/esphome/esphome:${{ matrix.esphome }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a standalone configuration using the GitHub component
        env:
          COMPONENT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          COMPONENT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import secrets
          from pathlib import Path
          import yaml

          # Keep the YAML's !secret tags, and use the commit under test instead
          # of the example branch, including for pull requests from forks.
          config = Path(os.environ["CONFIG_FILE"]).read_text()
          start = config.index("external_components:\n")
          end = config.index("\nlogger:\n", start)
          source = {
              "external_components": [{
                  "source": {
                      "type": "git",
                      "url": f"https://github.com/{os.environ['COMPONENT_REPOSITORY']}.git",
                      "ref": os.environ["COMPONENT_REF"],
                  },
                  "components": ["bluetti"],
                  "refresh": "0s",
              }]
          }
          config = config[:start] + yaml.safe_dump(source, sort_keys=False) + config[end:]
          target = Path("/tmp/esphome-compat")
          target.mkdir()
          (target / "bluetti-el30v2.yaml").write_text(config)
          (target / "secrets.yaml").write_text(yaml.safe_dump({
              "wifi_ssid": "build-test",
              "wifi_password": "build-test-password",
              "api_encryption_key": base64.b64encode(secrets.token_bytes(32)).decode("ascii"),
          }))
          PY
      - name: Compile using only the standalone YAML and GitHub source
        run: esphome compile /tmp/esphome-compat/bluetti-el30v2.yaml
